<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>miso-canvas2d — Haskell Canvas Solar System</title>
    <meta name="description" content="A procedural solar system with gravity-assisted comets, drawn on an HTML5 canvas from Haskell compiled to WebAssembly with the miso framework. Click to launch comets into orbit.">
    <link rel="canonical" href="https://canvas2d.haskell-miso.org/">
    <meta name="theme-color" content="#06081a">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://canvas2d.haskell-miso.org/">
    <meta property="og:title" content="miso-canvas2d — Haskell Canvas Solar System">
    <meta property="og:description" content="A gravity sandbox on the 2D canvas API, written in pure Haskell and compiled to WebAssembly with miso. Click to launch comets.">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="miso-canvas2d — Haskell Canvas Solar System">
    <meta name="twitter:description" content="A gravity sandbox on the 2D canvas API, written in Haskell and compiled to WebAssembly with miso.">
    <link rel="icon" href="favicon.ico">
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "miso-canvas2d",
      "url": "https://canvas2d.haskell-miso.org/",
      "applicationCategory": "DeveloperApplication",
      "operatingSystem": "Web",
      "description": "A procedural solar system drawn with the HTML5 canvas API from Haskell compiled to WebAssembly with the miso framework.",
      "codeRepository": "https://github.com/haskell-miso/miso-canvas2d"
    }
    </script>
    <style>
      :root {
        --bg: #06081a;
        --panel: #10142a;
        --panel-edge: #232948;
        --text: #e8eaf2;
        --muted: #98a0bb;
        --accent: #ffb347;
        --accent-2: #64d8ff;
        color-scheme: dark;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; }
      body {
        background:
          radial-gradient(1200px 600px at 70% -10%, rgba(255, 179, 71, .07), transparent),
          var(--bg);
        color: var(--text);
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        line-height: 1.55;
        -webkit-font-smoothing: antialiased;
      }
      .app { max-width: 860px; margin: 0 auto; padding: 1.25rem; }
      .hero { text-align: center; padding: 2.25rem 0 1.5rem; }
      .hero h1 {
        margin: 0 0 .5rem;
        font-size: clamp(1.9rem, 5vw, 2.8rem);
        letter-spacing: -.02em;
      }
      .hero h1 a { color: var(--text); text-decoration: none; }
      .hero h1 a:hover { color: var(--accent); }
      .tagline { margin: 0 auto 1.1rem; max-width: 42rem; color: var(--muted); font-size: 1.05rem; }
      .gh {
        display: inline-block;
        padding: .5rem 1.1rem;
        border: 1px solid var(--panel-edge);
        border-radius: 999px;
        background: var(--panel);
        color: var(--text);
        text-decoration: none;
        font-weight: 600;
        font-size: .92rem;
        transition: border-color .15s ease, transform .15s ease;
      }
      .gh:hover { border-color: var(--accent); transform: translateY(-1px); }
      .panel {
        background: var(--panel);
        border: 1px solid var(--panel-edge);
        border-radius: 16px;
        padding: 1.25rem;
      }
      .stage {
        display: block;
        width: 100%;
        aspect-ratio: 1;
        border-radius: 12px;
        border: 1px solid var(--panel-edge);
        background: #06081a;
        cursor: crosshair;
        touch-action: manipulation;
      }
      .hint { margin: .9rem 0; color: var(--muted); font-size: .92rem; text-align: center; }
      .controls { display: flex; flex-wrap: wrap; gap: .5rem; justify-content: center; }
      .btn {
        padding: .5rem 1rem;
        border-radius: 8px;
        border: 1px solid var(--panel-edge);
        background: var(--bg);
        color: var(--text);
        font-size: .92rem;
        font-weight: 600;
        cursor: pointer;
      }
      .btn:hover { border-color: var(--accent); }
      .foot { text-align: center; color: var(--muted); font-size: .9rem; padding: 2rem 0 1rem; }
      .foot a { color: var(--accent); text-decoration: none; }
      .foot a:hover { text-decoration: underline; }
      .foot code, .hint code {
        font-family: ui-monospace, Menlo, monospace;
        font-size: .85em;
        background: var(--bg);
        border-radius: 6px;
        padding: .1em .35em;
      }
      body:has(> .app) .boot, body:has(> .stage) .boot { display: none; }
      .boot {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        gap: 1rem;
        align-items: center;
        justify-content: center;
        color: var(--muted);
      }
      .boot .spin {
        width: 42px; height: 42px;
        border-radius: 50%;
        border: 3px solid var(--panel-edge);
        border-top-color: var(--accent);
        animation: spin 1s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      @media (max-width: 560px) { .app { padding: .9rem; } }
    </style>
  </head>
  <body>
    <div class="boot">
      <div class="spin" aria-hidden="true"></div>
      <p>Loading Haskell WebAssembly&hellip;</p>
      <noscript>miso-canvas2d is an interactive WebAssembly demo and needs JavaScript enabled.</noscript>
    </div>
    <script type="module" src="index.js"></script>
  </body>
</html>
